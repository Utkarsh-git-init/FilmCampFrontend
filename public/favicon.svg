<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #1a5f7a; }
            .fire-outer { fill: #ffffff; }
            .fire-inner { fill: #e04343; }
            .log { fill: #ffffff; }
            .log-detail { fill: #1a5f7a; }
        </style>
    </defs>

    <!-- Rounded Square Background Container -->
    <rect width="512" height="512" rx="120" class="bg" />

    <!-- THE FIRE -->
    <!-- Outer White Flame Shape -->
    <path d="M256,90 C295,150 315,190 315,240 C315,290 275,320 256,320 C237,320 197,290 197,240 C197,185 220,140 256,90 Z" class="fire-outer" />
    <!-- Inner Red Flame Shape -->
    <path d="M256,150 C280,195 290,220 290,255 C290,290 270,310 256,310 C242,310 222,290 222,255 C222,215 235,185 256,150 Z" class="fire-inner" />

    <!-- THE LOGS (Film Strips) -->
    <g id="film-logs">
        <!-- Log 1: Going from Bottom-Left to Top-Right -->
        <g transform="translate(256, 310) rotate(-25) translate(-256, -310)">
            <!-- Main Log Body -->
            <rect x="126" y="290" width="260" height="45" rx="8" class="log" />
            <!-- Film Sprocket Holes (Top & Bottom Rows) -->
            <rect x="146" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="176" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="206" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="236" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="266" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="296" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="326" y="294" width="12" height="8" rx="2" class="log-detail" />
            <rect x="356" y="294" width="12" height="8" rx="2" class="log-detail" />

            <rect x="146" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="176" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="206" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="236" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="266" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="296" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="326" y="323" width="12" height="8" rx="2" class="log-detail" />
            <rect x="356" y="323" width="12" height="8" rx="2" class="log-detail" />

            <!-- Log Roll End Effect -->
            <circle cx="136" cy="312.5" r="14" class="log-detail" />
            <circle cx="136" cy="312.5" r="6" class="log" />
        </g>

        <!-- Log 2: Going from Bottom-Right to Top-Left -->
        <g transform="translate(256, 325) rotate(25) translate(-256, -325)">
            <!-- Main Log Body -->
            <rect x="126" y="305" width="260" height="45" rx="8" class="log" />
            <!-- Film Sprocket Holes (Top & Bottom Rows) -->
            <rect x="146" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="176" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="206" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="236" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="266" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="296" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="326" y="309" width="12" height="8" rx="2" class="log-detail" />
            <rect x="356" y="309" width="12" height="8" rx="2" class="log-detail" />

            <rect x="146" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="176" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="206" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="236" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="266" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="296" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="326" y="338" width="12" height="8" rx="2" class="log-detail" />
            <rect x="356" y="338" width="12" height="8" rx="2" class="log-detail" />

            <!-- Log Roll End Effect -->
            <circle cx="376" cy="327.5" r="14" class="log-detail" />
            <circle cx="376" cy="327.5" r="6" class="log" />
        </g>
    </g>
</svg>
